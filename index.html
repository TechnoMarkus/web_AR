<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Viewer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <a-scene embedded
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true; colorManagement: true">

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="1 3 2"></a-entity>

    <a-marker id="marker" preset="hiro">
      <!-- #root is the thing the student sees; #model is auto-centred and scaled to fit the marker -->
      <a-entity id="root">
        <a-entity id="model"></a-entity>
      </a-entity>
    </a-marker>

    <a-entity id="camera" camera></a-entity>
  </a-scene>

  <div id="panel">
    <div id="dropzone" tabindex="0" role="button" aria-label="Choose or drop a 3D model">
      <strong>Drop a 3D model here</strong>
      <span>or tap to choose a file</span>
      <small>.stl &nbsp; .glb / .gltf &nbsp; .obj</small>
      <input id="file-input" type="file" accept=".stl,.glb,.gltf,.obj" hidden>
    </div>
    <div id="status" role="status" aria-live="polite">No model loaded.</div>
    <button id="mode-btn" type="button" disabled>Preview without marker</button>
    <p id="hint">
      Point the camera at the
      <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" rel="noopener">Hiro marker</a>.
    </p>
  </div>

  <div id="drag-overlay">Drop to load model</div>

  <script src="js/main.js"></script>
</body>
</html>
